<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post • Entre Nós ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-container">

            <a href="index.html" class="logo">
                Entre Nós ♡
            </a>

            <nav>
                <a href="index.html">Início</a>
                <a href="index.html#explorar">Explorar</a>
                <a href="index.html#categorias">Categorias</a>
            </nav>

            <button class="btn btn-principal">
                Meu perfil
            </button>

        </div>
    </header>


    <main>

        <!-- BOTÃO VOLTAR -->
        <a href="index.html" class="voltar">
            ← Voltar para os posts
        </a>


        <!-- POST PRINCIPAL -->
        <article class="post-card post-detalhe">

            <div class="post-topo">

                <div class="usuario">

                    <div class="avatar">
                        🌸
                    </div>

                    <div>

                        <div class="nome-usuario">
                            Anônima
                        </div>

                        <div class="tempo-post">
                            há 2 horas
                        </div>

                    </div>

                </div>

            </div>


            <div class="post-categoria">
                🤷 Ele gosta de mim?
            </div>


            <h1 id="titulo-post">
                Carregando...
            </h1>


            <p id="texto-post">
                Carregando...
            </p>


            <div class="post-acoes">

                <button class="acao curtir">
                    ♡ <span id="numero-curtidas">0</span>
                </button>

                <button class="acao">
                    💬 Comentários
                </button>

                <button class="acao salvar">
                    🔖 Salvar
                </button>

            </div>

        </article>


        <!-- COMENTÁRIOS -->
        <section class="comentarios-area">

            <h2>
                Comentários ♡
            </h2>


            <div id="lista-comentarios">

                <div class="comentario">

                    <strong>🌸 Anônima</strong>

                    <p>
                        Você não está sozinha nisso 🩷
                    </p>

                </div>

            </div>


            <!-- ADICIONAR COMENTÁRIO -->

            <div class="adicionar-comentario">

                <input
                    type="text"
                    id="input-comentario"
                    placeholder="Escreva um comentário..."
                >

                <button
                    class="btn btn-principal"
                    id="enviar-comentario"
                >
                    Enviar
                </button>

            </div>

        </section>

    </main>


    <footer>

        Feito com <span>♡</span>
        para quem precisa de um lugar para falar.

        <br><br>

        © 2026 Entre Nós

    </footer>


    <script src="script.js"></script>

</body>

</html>
